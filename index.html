<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spider web</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3efe6;
      --muted: #b7b1a6;
      --gold: #e4c27a;
      --gold-ink: #241b0c;
      --panel: rgba(10, 11, 14, 0.78);
      --line: rgba(243, 239, 230, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #090a0d;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
      cursor: crosshair;
    }

    canvas.woven { cursor: crosshair; }

    .hud {
      position: fixed;
      z-index: 2;
      top: 18px;
      left: 18px;
      width: min(320px, calc(100vw - 36px));
      padding: 14px 14px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: var(--ink);
      font: 15px/1.45 "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      pointer-events: none;
      backdrop-filter: blur(12px);
    }

    .hud h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .hud p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .count {
      margin-top: 8px !important;
      color: var(--ink) !important;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      pointer-events: auto;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    button.primary {
      background: var(--gold);
      border-color: transparent;
      color: var(--gold-ink);
    }

    button:disabled {
      opacity: 0.38;
      cursor: default;
    }

    @media (max-width: 640px) {
      .hud {
        top: auto;
        bottom: 12px;
        left: 12px;
        width: calc(100vw - 24px);
      }
    }
  </style>
</head>
<body>
  <canvas id="web" aria-label="Spider web. Click to place anchors, then weave."></canvas>
  <div class="hud">
    <h1>Spider silk</h1>
    <p id="hint">Click to place anchors. Five or more, then weave.</p>
    <p class="count" id="count">0 points</p>
    <div class="row">
      <button id="weave" class="primary" type="button" disabled>Weave web</button>
      <button id="clear" type="button">Clear</button>
    </div>
  </div>
  <script>
    const MIN_POINTS = 5;
    const MAX_POINTS = 40;
    const TURNS = 6;
    const DUPLICATE_PX = 14;

    const canvas = document.getElementById("web");
    const ctx = canvas.getContext("2d");
    const hintEl = document.getElementById("hint");
    const countEl = document.getElementById("count");
    const weaveBtn = document.getElementById("weave");
    const clearBtn = document.getElementById("clear");

    const anchors = [];
    let nodes = [];
    let springs = [];
    let mode = "place";
    let cssW = 1;
    let cssH = 1;
    let pointer = null;
    let placeDown = null;
    let hubIndex = 0;

    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    let reduceMotion = motionQuery.matches;
    motionQuery.addEventListener?.("change", (event) => {
      reduceMotion = event.matches;
    });

    function resize() {
      const oldW = cssW;
      const oldH = cssH;
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      cssW = window.innerWidth;
      cssH = window.innerHeight;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (mode === "woven" && oldW > 1 && oldH > 1 && (oldW !== cssW || oldH !== cssH)) {
        const sx = cssW / oldW;
        const sy = cssH / oldH;
        for (const node of nodes) {
          const offX = node.x - node.restX;
          const offY = node.y - node.restY;
          const prevX = node.ox - node.restX;
          const prevY = node.oy - node.restY;
          node.restX = node.nx * cssW;
          node.restY = node.ny * cssH;
          node.x = node.restX + offX * sx;
          node.y = node.restY + offY * sy;
          node.ox = node.restX + prevX * sx;
          node.oy = node.restY + prevY * sy;
          if (node.pinned) {
            node.x = node.ox = node.restX;
            node.y = node.oy = node.restY;
          }
        }
        for (const spring of springs) {
          const a = nodes[spring.a];
          const b = nodes[spring.b];
          spring.rest = Math.hypot(b.restX - a.restX, b.restY - a.restY);
        }
      }
    }

    function updateHud() {
      const count = anchors.length;
      const noun = count === 1 ? "point" : "points";
      if (mode === "woven") {
        countEl.textContent = `${count} ${noun} · silk is live`;
        hintEl.textContent = "Swipe across the silk. It springs back into place.";
        weaveBtn.textContent = "Woven";
        weaveBtn.disabled = true;
        canvas.classList.add("woven");
        canvas.setAttribute("aria-label", "Woven spider web. Move across the strands to pluck them.");
      } else {
        const more = Math.max(0, MIN_POINTS - count);
        countEl.textContent = more > 0 ? `${count} ${noun} · ${more} more to weave` : `${count} ${noun}`;
        if (count >= MAX_POINTS) {
          hintEl.textContent = "Forty anchors is the limit. Weave when you are ready.";
        } else {
          hintEl.textContent = "Click to place anchors. Five or more, then weave.";
        }
        weaveBtn.textContent = "Weave web";
        weaveBtn.disabled = count < MIN_POINTS;
        canvas.classList.remove("woven");
        canvas.setAttribute("aria-label", "Spider web. Click to place anchors, then weave.");
      }
    }

    function addAnchor(x, y) {
      if (mode !== "place" || anchors.length >= MAX_POINTS) return false;
      for (const anchor of anchors) {
        const dx = anchor.nx * cssW - x;
        const dy = anchor.ny * cssH - y;
        if (dx * dx + dy * dy < DUPLICATE_PX * DUPLICATE_PX) return false;
      }
      anchors.push({ nx: x / cssW, ny: y / cssH });
      updateHud();
      return true;
    }

    function makeNode(x, y, pinned) {
      return {
        x, y, ox: x, oy: y,
        restX: x, restY: y,
        nx: x / cssW, ny: y / cssH,
        pinned
      };
    }

    function weave() {
      if (anchors.length < MIN_POINTS || mode === "woven") return;
      const count = anchors.length;
      let cx = 0;
      let cy = 0;
      for (const anchor of anchors) {
        cx += anchor.nx;
        cy += anchor.ny;
      }
      cx /= count;
      cy /= count;

      const sorted = anchors.map((anchor, index) => ({
        ...anchor,
        index,
        angle: Math.atan2(anchor.ny - cy, anchor.nx - cx)
      })).sort((a, b) => a.angle - b.angle || a.index - b.index);

      const hx = cx * cssW;
      const hy = cy * cssH;
      nodes = [makeNode(hx, hy, true)];
      hubIndex = 0;

      const dirs = [];
      const spokeNodes = Array.from({ length: count }, () => []);
      for (let i = 0; i < count; i++) {
        const anchor = sorted[i];
        let vx = anchor.nx * cssW - hx;
        let vy = anchor.ny * cssH - hy;
        const span = Math.hypot(vx, vy);
        if (span < 8) {
          const angle = anchor.angle || (i / count) * Math.PI * 2;
          vx = Math.cos(angle) * 8;
          vy = Math.sin(angle) * 8;
        }
        dirs.push({ x: vx, y: vy });
      }

      // One capture spiral: radius grows with every step around the hub,
      // so the cross strands wind outward instead of closing into rings.
      const steps = count * TURNS;
      const spiralIds = [];
      for (let s = 0; s < steps; s++) {
        const i = s % count;
        const t = 0.07 + 0.86 * (s / (steps - 1));
        const id = nodes.length;
        nodes.push(makeNode(hx + dirs[i].x * t, hy + dirs[i].y * t, false));
        spokeNodes[i].push(id);
        spiralIds.push(id);
      }
      for (let i = 0; i < count; i++) {
        const id = nodes.length;
        nodes.push(makeNode(hx + dirs[i].x, hy + dirs[i].y, true));
        spokeNodes[i].push(id);
      }

      springs = [];
      const link = (a, b, kind, stiff) => {
        const na = nodes[a];
        const nb = nodes[b];
        const rest = Math.hypot(nb.x - na.x, nb.y - na.y);
        if (rest < 0.5) return;
        springs.push({ a, b, rest, kind, stiff });
      };

      for (let i = 0; i < count; i++) {
        const spoke = spokeNodes[i];
        link(hubIndex, spoke[0], "radial", 0.46);
        for (let k = 0; k < spoke.length - 1; k++) {
          link(spoke[k], spoke[k + 1], "radial", 0.46);
        }
        const anchorA = spoke[spoke.length - 1];
        const nextSpoke = spokeNodes[(i + 1) % count];
        link(anchorA, nextSpoke[nextSpoke.length - 1], "frame", 0.2);
      }

      for (let s = 0; s < spiralIds.length - 1; s++) {
        link(spiralIds[s], spiralIds[s + 1], "spiral", 0.28);
      }

      mode = "woven";
      updateHud();
    }

    function clearAll() {
      anchors.length = 0;
      nodes = [];
      springs = [];
      mode = "place";
      pointer = null;
      updateHud();
    }

    function closestOnSegments(ax, ay, bx, by, cx, cy, dx, dy) {
      const abx = bx - ax;
      const aby = by - ay;
      const cdx = dx - cx;
      const cdy = dy - cy;
      const acx = ax - cx;
      const acy = ay - cy;
      const A = abx * abx + aby * aby;
      const B = abx * cdx + aby * cdy;
      const C = cdx * cdx + cdy * cdy;
      const D = abx * acx + aby * acy;
      const E = cdx * acx + cdy * acy;
      let s = 0;
      let t = 0;
      const denom = A * C - B * B;
      if (denom > 1e-8) s = Math.max(0, Math.min(1, (B * E - C * D) / denom));
      if (C > 1e-8) t = (B * s + E) / C;
      if (t < 0) {
        t = 0;
        s = A > 1e-8 ? Math.max(0, Math.min(1, -D / A)) : 0;
      } else if (t > 1) {
        t = 1;
        s = A > 1e-8 ? Math.max(0, Math.min(1, (B - D) / A)) : 0;
      }
      const px = ax + s * abx;
      const py = ay + s * aby;
      const qx = cx + t * cdx;
      const qy = cy + t * cdy;
      return { dist: Math.hypot(px - qx, py - qy), t };
    }

    function disturb(x0, y0, x1, y1) {
      const mvx = x1 - x0;
      const mvy = y1 - y0;
      const speed = Math.hypot(mvx, mvy);
      if (speed < 0.75) return;
      const radius = Math.max(18, Math.min(cssW, cssH) * 0.022);
      const dirX = mvx / speed;
      const dirY = mvy / speed;
      const power = Math.min(speed, 46) * (reduceMotion ? 0.28 : 0.78);
      const accX = new Float64Array(nodes.length);
      const accY = new Float64Array(nodes.length);
      let touched = false;

      for (const spring of springs) {
        const a = nodes[spring.a];
        const b = nodes[spring.b];
        if (a.pinned && b.pinned) continue;
        const hit = closestOnSegments(x0, y0, x1, y1, a.x, a.y, b.x, b.y);
        if (hit.dist > radius) continue;
        touched = true;
        const falloff = (1 - hit.dist / radius) ** 1.35;
        const mag = power * falloff;
        let wA = 1 - hit.t;
        let wB = hit.t;
        if (a.pinned) {
          wA = 0;
          wB = 1;
        } else if (b.pinned) {
          wA = 1;
          wB = 0;
        }
        accX[spring.a] += dirX * mag * wA;
        accY[spring.a] += dirY * mag * wA;
        accX[spring.b] += dirX * mag * wB;
        accY[spring.b] += dirY * mag * wB;
      }

      if (!touched) return;
      const cap = reduceMotion ? 14 : 38;
      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        if (node.pinned) continue;
        let dx = accX[i];
        let dy = accY[i];
        const mag = Math.hypot(dx, dy);
        if (mag < 0.01) continue;
        if (mag > cap) {
          dx = dx * cap / mag;
          dy = dy * cap / mag;
        }
        node.x += dx;
        node.y += dy;
        node.ox -= dx * 0.5;
        node.oy -= dy * 0.5;
      }
    }

    function step() {
      if (mode !== "woven") return;
      const damp = reduceMotion ? 0.62 : 0.972;
      const restPull = reduceMotion ? 0.22 : 0.012;

      for (const node of nodes) {
        if (node.pinned) {
          node.x = node.ox = node.restX;
          node.y = node.oy = node.restY;
          continue;
        }
        const vx = (node.x - node.ox) * damp;
        const vy = (node.y - node.oy) * damp;
        node.ox = node.x;
        node.oy = node.y;
        node.x += vx;
        node.y += vy;
        node.x += (node.restX - node.x) * restPull;
        node.y += (node.restY - node.y) * restPull;
      }

      const passes = reduceMotion ? 3 : 4;
      for (let pass = 0; pass < passes; pass++) {
        for (const spring of springs) {
          const a = nodes[spring.a];
          const b = nodes[spring.b];
          if (a.pinned && b.pinned) continue;
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 1e-4) continue;
          const diff = (dist - spring.rest) / dist;
          const imA = a.pinned ? 0 : 1;
          const imB = b.pinned ? 0 : 1;
          const corr = diff * spring.stiff / (imA + imB);
          dx *= corr;
          dy *= corr;
          a.x += dx * imA;
          a.y += dy * imA;
          b.x -= dx * imB;
          b.y -= dy * imB;
        }
      }

      for (const node of nodes) {
        if (!node.pinned) continue;
        node.x = node.ox = node.restX;
        node.y = node.oy = node.restY;
      }
    }

    function strandStyle(spring) {
      const a = nodes[spring.a];
      const b = nodes[spring.b];
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const tension = Math.min(1, Math.abs(dist - spring.rest) / Math.max(spring.rest, 1) * 3.2);
      if (spring.kind === "frame") {
        return { alpha: 0.42 + tension * 0.4, width: 1.35, color: "228, 194, 122" };
      }
      if (spring.kind === "radial") {
        return { alpha: 0.28 + tension * 0.55, width: 1.05, color: "236, 232, 224" };
      }
      return { alpha: 0.72 + tension * 0.28, width: 1.25, color: "226, 206, 164" };
    }

    function drawBackground() {
      let hx = cssW * 0.5;
      let hy = cssH * 0.5;
      if (mode === "woven" && nodes[hubIndex]) {
        hx = nodes[hubIndex].restX;
        hy = nodes[hubIndex].restY;
      }
      const gradient = ctx.createRadialGradient(hx, hy, 20, hx, hy, Math.max(cssW, cssH) * 0.72);
      gradient.addColorStop(0, "#1c1e26");
      gradient.addColorStop(1, "#090a0d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, cssW, cssH);
    }

    function drawAnchor(x, y, woven) {
      ctx.beginPath();
      ctx.arc(x, y, woven ? 3.2 : 5, 0, Math.PI * 2);
      ctx.fillStyle = "#e4c27a";
      ctx.fill();
      if (!woven) {
        ctx.beginPath();
        ctx.arc(x, y, 9, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(228, 194, 122, 0.45)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function draw() {
      drawBackground();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (mode === "place") {
        for (const anchor of anchors) drawAnchor(anchor.nx * cssW, anchor.ny * cssH, false);
        return;
      }

      for (const spring of springs) {
        const style = strandStyle(spring);
        const a = nodes[spring.a];
        const b = nodes[spring.b];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(${style.color}, ${style.alpha})`;
        ctx.lineWidth = style.width;
        ctx.stroke();
      }

      const hub = nodes[hubIndex];
      ctx.beginPath();
      ctx.arc(hub.x, hub.y, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = "#f3efe6";
      ctx.fill();

      for (const node of nodes) {
        if (node.pinned && node !== hub) drawAnchor(node.x, node.y, true);
      }

      if (pointer) {
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, 11, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(243, 239, 230, 0.35)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function frame() {
      step();
      draw();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      placeDown = { id: event.pointerId, x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointerenter", (event) => {
      pointer = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener("pointermove", (event) => {
      const x = event.clientX;
      const y = event.clientY;
      if (mode === "woven" && pointer) disturb(pointer.x, pointer.y, x, y);
      pointer = { x, y };
    });

    canvas.addEventListener("pointerup", (event) => {
      if (!placeDown || placeDown.id !== event.pointerId) return;
      const travel = Math.hypot(event.clientX - placeDown.x, event.clientY - placeDown.y);
      placeDown = null;
      if (mode === "place" && travel < 7) addAnchor(event.clientX, event.clientY);
    });

    canvas.addEventListener("pointercancel", () => {
      placeDown = null;
    });

    canvas.addEventListener("pointerleave", () => {
      pointer = null;
    });

    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    weaveBtn.addEventListener("click", weave);
    clearBtn.addEventListener("click", clearAll);

    window.addEventListener("resize", resize);
    window.visualViewport?.addEventListener("resize", resize);

    resize();
    updateHud();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
